name: Sincronizar calendario

on:
  schedule:
    - cron: "17 */3 * * *"   # cada 3 horas
  workflow_dispatch: {}       # boton "Run workflow" para lanzarlo a mano

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python sync_calendar.py
      - name: Guardar cambios
        run: |
          git config user.name "calendar-bot"
          git config user.email "calendar-bot@users.noreply.github.com"
          git add data/availability.js
          git diff --cached --quiet || git commit -m "Actualizar disponibilidad"
          git push
